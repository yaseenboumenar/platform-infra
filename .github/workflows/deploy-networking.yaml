# =============================================================================
# .github/workflows/deploy-networking.yaml
#
# Deploys baseline VPC/networking to a target account.
#
# ACCOUNT → SECRET → VPC CIDR mapping:
#   ingest + dv  → INGEST_DV_ACCOUNT_ID          10.0.0.0/16
#   ingest + te  → INGEST_TE_ACCOUNT_ID          10.1.0.0/16
#   ingest + pp  → INGEST_PP_ACCOUNT_ID          10.2.0.0/16
#   ingest + pd  → INGEST_PD_ACCOUNT_ID          10.3.0.0/16
#   process-storage + dv → PROCESS_DV_ACCOUNT_ID 10.10.0.0/16
#   process-storage + te → PROCESS_TE_ACCOUNT_ID 10.11.0.0/16
#   process-storage + pp → PROCESS_PP_ACCOUNT_ID 10.12.0.0/16
#   process-storage + pd → PROCESS_PD_ACCOUNT_ID 10.13.0.0/16
#
# PROMOTION MODEL:
#   dv  — auto-deploys on push to main (both layers in parallel)
#   te  — manual trigger, plan or apply
#   pp  — manual trigger, requires GitHub environment approval
#   pd  — manual trigger, requires GitHub environment approval
# =============================================================================

name: Deploy Networking

on:
  push:
    branches: [main]
    paths:
      - 'terraform/networking/**'
  workflow_dispatch:
    inputs:
      layer:
        description: 'Target layer'
        required: true
        type: choice
        options: [ingest, process-storage]
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dv, te, pp, pd]
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  id-token: write   # required to request OIDC token
  contents: read    # required for actions/checkout

jobs:

  # Auto-deploy both layers to dv on push to main
  deploy-dv:
    name: Auto deploy ${{ matrix.layer }}-dv
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ matrix.layer }}-dv
    strategy:
      matrix:
        layer: [ingest, process-storage]
      fail-fast: false   # don't cancel process-storage if ingest fails

    steps:
      - uses: actions/checkout@v4

      - name: Set account config
        run: |
          if [ "${{ matrix.layer }}" = "ingest" ]; then
            echo "ACCOUNT_ID=${{ secrets.INGEST_DV_ACCOUNT_ID }}" >> $GITHUB_ENV
            echo "VPC_CIDR=10.0.0.0/16" >> $GITHUB_ENV
          else
            echo "ACCOUNT_ID=${{ secrets.PROCESS_DV_ACCOUNT_ID }}" >> $GITHUB_ENV
            echo "VPC_CIDR=10.10.0.0/16" >> $GITHUB_ENV
          fi
          echo "LAYER=${{ matrix.layer }}" >> $GITHUB_ENV
          echo "ENV=dv" >> $GITHUB_ENV
          echo "ENABLE_GLUE_ENDPOINT=true" >> $GITHUB_ENV

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-actions-platform-dv
          aws-region: eu-west-2
          role-session-name: networking-${{ matrix.layer }}-dv-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Init
        working-directory: terraform/networking
        run: |
          terraform init \
            -backend-config="bucket=qbits-tfstate-${{ env.LAYER }}-${{ env.ENV }}" \
            -backend-config="key=networking/terraform.tfstate" \
            -backend-config="region=eu-west-2" \
            -backend-config="dynamodb_table=qbits-tflock-${{ env.LAYER }}-${{ env.ENV }}" \
            -reconfigure

      - name: Terraform Plan and Apply
        working-directory: terraform/networking
        run: |
          terraform plan \
            -var="environment=${{ env.ENV }}" \
            -var="layer=${{ env.LAYER }}" \
            -var="account_id=${{ env.ACCOUNT_ID }}" \
            -var="vpc_cidr=${{ env.VPC_CIDR }}" \
            -var="vpc_cidr=${{ env.VPC_CIDR }}" \
            -out=tfplan
          terraform apply -auto-approve tfplan

  # Manual deploy to any layer/environment
  deploy-manual:
    name: Deploy ${{ github.event.inputs.layer }}-${{ github.event.inputs.environment }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.layer }}-${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Set account config
        run: |
          LAYER="${{ github.event.inputs.layer }}"
          ENV="${{ github.event.inputs.environment }}"
          case "${LAYER}_${ENV}" in
            ingest_dv)            ACCOUNT="${{ secrets.INGEST_DV_ACCOUNT_ID }}";   CIDR="10.0.0.0/16"  ;;
            ingest_te)            ACCOUNT="${{ secrets.INGEST_TE_ACCOUNT_ID }}";   CIDR="10.1.0.0/16"  ;;
            ingest_pp)            ACCOUNT="${{ secrets.INGEST_PP_ACCOUNT_ID }}";   CIDR="10.2.0.0/16"  ;;
            ingest_pd)            ACCOUNT="${{ secrets.INGEST_PD_ACCOUNT_ID }}";   CIDR="10.3.0.0/16"  ;;
            process-storage_dv)   ACCOUNT="${{ secrets.PROCESS_DV_ACCOUNT_ID }}";  CIDR="10.10.0.0/16" ;;
            process-storage_te)   ACCOUNT="${{ secrets.PROCESS_TE_ACCOUNT_ID }}";  CIDR="10.11.0.0/16" ;;
            process-storage_pp)   ACCOUNT="${{ secrets.PROCESS_PP_ACCOUNT_ID }}";  CIDR="10.12.0.0/16" ;;
            process-storage_pd)   ACCOUNT="${{ secrets.PROCESS_PD_ACCOUNT_ID }}";  CIDR="10.13.0.0/16" ;;
          esac
          echo "ACCOUNT_ID=$ACCOUNT" >> $GITHUB_ENV
          echo "VPC_CIDR=$CIDR"      >> $GITHUB_ENV
          echo "LAYER=$LAYER"        >> $GITHUB_ENV
          echo "ENV=$ENV"            >> $GITHUB_ENV
          echo "ENABLE_GLUE_ENDPOINT=false" >> $GITHUB_ENV

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-actions-platform-${{ env.ENV }}
          aws-region: eu-west-2
          role-session-name: networking-${{ env.LAYER }}-${{ env.ENV }}-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Init
        working-directory: terraform/networking
        run: |
          terraform init \
            -backend-config="bucket=qbits-tfstate-${{ env.LAYER }}-${{ env.ENV }}" \
            -backend-config="key=networking/terraform.tfstate" \
            -backend-config="region=eu-west-2" \
            -backend-config="dynamodb_table=qbits-tflock-${{ env.LAYER }}-${{ env.ENV }}" \
            -reconfigure

      - name: Terraform Plan
        working-directory: terraform/networking
        run: |
          terraform plan \
            -var="environment=${{ env.ENV }}" \
            -var="layer=${{ env.LAYER }}" \
            -var="account_id=${{ env.ACCOUNT_ID }}" \
            -var="vpc_cidr=${{ env.VPC_CIDR }}" \
            -var="vpc_cidr=${{ env.VPC_CIDR }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: terraform/networking
        run: terraform apply -auto-approve tfplan
